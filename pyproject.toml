[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "brainco-retargeting"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "dex-retargeting",
    "pyyaml",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
brainco_retargeting = ["assets/**/*"]
