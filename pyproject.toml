[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "brainco-retargeting"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "dex-retargeting @ git+https://github.com/dexsuite/dex-retargeting",
    "pyyaml",
    "torch",
]

[project.optional-dependencies]
# mediapipe==0.10.21 requires numpy<2; dex-retargeting requires numpy>=2.
# The conflict is resolved by override-dependencies below (uv root-project only).
# Downstream projects must add the same [tool.uv] block to their own pyproject.toml.
live = [
    "mediapipe==0.10.21",
    "sapien>=3.0.0",
    "opencv-python>=4.8",
]

[tool.uv]
override-dependencies = ["numpy>=1.24,<2"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
brainco_retargeting = ["assets/**/*"]

